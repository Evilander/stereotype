[project]
name = "stereotype-audit"
version = "0.1.0"
description = "Stereo-pair bias auditor for Hugging Face text models: chat LMs, embedders, classifiers. Local, judge-free, with confidence intervals."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Tyler Eveland" }]
keywords = ["bias", "fairness", "audit", "stereotype", "huggingface", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.4",
  "transformers>=4.57",
  "sentence-transformers>=3.0",
  "datasets>=3.0",
  "huggingface_hub>=0.30",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.43"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
stereotype = "stereotype_audit.cli:main"

[project.urls]
Homepage = "https://github.com/evilander/stereotype"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stereotype_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gpu: needs a CUDA device and the full-size subjects",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
